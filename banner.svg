<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#1A1240"/>
      <stop offset="100%" stop-color="#512BD4"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B9A4FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <circle cx="1050" cy="60" r="140" fill="#8A63FF" opacity="0.18">
    <animate attributeName="r" values="130;160;130" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="230" r="90" fill="#00D4FF" opacity="0.10">
    <animate attributeName="cy" values="230;210;230" dur="5s" repeatCount="indefinite"/>
  </circle>
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="78" fill="#8A63FF" font-size="18" font-weight="600" letter-spacing="4">HOLA, SOY</text>
    <text x="68" y="140" fill="url(#txt)" font-size="62" font-weight="800">Jesús · JDMT</text>
    <text x="70" y="182" fill="#C9D1D9" font-size="24" font-weight="500">Full Stack Developer — C# / ASP.NET Core · MongoDB</text>
    <text x="70" y="218" fill="#8B949E" font-size="18">APIs REST · JavaScript / TypeScript · Python · Automatización con n8n e IA</text>
  </g>
  <g font-family="Consolas, 'Fira Code', monospace" font-size="20" fill="#B9A4FF" opacity="0.85">
    <text x="900" y="120">&lt;/&gt;</text>
    <text x="1010" y="170">{ C# }</text>
    <text x="930" y="210">.NET</text>
  </g>
  <rect x="70" y="232" width="0" height="4" rx="2" fill="#8A63FF">
    <animate attributeName="width" values="0;260;260" dur="3s" fill="freeze"/>
  </rect>
</svg>
