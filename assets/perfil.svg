<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.r{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.l{opacity:0;animation:left .9s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1.2s ease forwards}
.d{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes left{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
</style><rect width="1200" height="470" rx="16" fill="#0D1117" stroke="#30363D"/><g class="l" style="animation-delay:0s"><text x="40" y="58" fill="#8A63FF" font-size="14" font-weight="700" letter-spacing="3">01 — PERFIL</text><text x="40" y="92" fill="#FFFFFF" font-size="30" font-weight="800">Sobre mí</text></g><line class="d" x1="40" y1="110" x2="1160" y2="110" stroke="#512BD4" stroke-width="2" style="animation-delay:0.3s"/><text class="r" style="animation-delay:0.80s" x="40" y="160" fill="#C9D1D9" font-size="21">Desarrollador Full Stack especializado en el ecosistema .NET. Diseño y construyo</text><text class="r" style="animation-delay:0.98s" x="40" y="194" fill="#C9D1D9" font-size="21">aplicaciones web y APIs con C# y ASP.NET Core, persistencia en MongoDB e interfaces</text><text class="r" style="animation-delay:1.16s" x="40" y="228" fill="#C9D1D9" font-size="21">en JavaScript / TypeScript. Complemento el desarrollo con automatización de procesos</text><text class="r" style="animation-delay:1.34s" x="40" y="262" fill="#C9D1D9" font-size="21">mediante n8n e integraciones con modelos de IA, orientado a resolver necesidades</text><text class="r" style="animation-delay:1.52s" x="40" y="296" fill="#C9D1D9" font-size="21">reales de negocio.</text><g class="r" style="animation-delay:1.90s"><rect x="40" y="350" width="265" height="90" rx="12" fill="#161B22" stroke="#30363D"/><rect x="40" y="350" width="4" height="90" rx="2" fill="#8A63FF"/><text x="64" y="390" fill="#FFFFFF" font-size="24" font-weight="700">.NET</text><text x="64" y="418" fill="#8B949E" font-size="15">Especialidad</text></g><g class="r" style="animation-delay:2.05s"><rect x="325" y="350" width="265" height="90" rx="12" fill="#161B22" stroke="#30363D"/><rect x="325" y="350" width="4" height="90" rx="2" fill="#8A63FF"/><text x="349" y="390" fill="#FFFFFF" font-size="24" font-weight="700">Full Stack</text><text x="349" y="418" fill="#8B949E" font-size="15">Backend + Frontend</text></g><g class="r" style="animation-delay:2.20s"><rect x="610" y="350" width="265" height="90" rx="12" fill="#161B22" stroke="#30363D"/><rect x="610" y="350" width="4" height="90" rx="2" fill="#8A63FF"/><text x="634" y="390" fill="#FFFFFF" font-size="24" font-weight="700">APIs REST</text><text x="634" y="418" fill="#8B949E" font-size="15">Diseño e integración</text></g><g class="r" style="animation-delay:2.35s"><rect x="895" y="350" width="265" height="90" rx="12" fill="#161B22" stroke="#30363D"/><rect x="895" y="350" width="4" height="90" rx="2" fill="#8A63FF"/><text x="919" y="390" fill="#FFFFFF" font-size="24" font-weight="700">n8n + IA</text><text x="919" y="418" fill="#8B949E" font-size="15">Automatización</text></g></svg>
