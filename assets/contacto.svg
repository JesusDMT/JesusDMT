<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280"><style>
text{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
.r{opacity:0;animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.l{opacity:0;animation:left .9s cubic-bezier(.2,.7,.2,1) forwards}
.f{opacity:0;animation:fade 1.2s ease forwards}
.d{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.6s ease forwards}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes left{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes fade{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
</style><rect width="1200" height="280" rx="16" fill="#0D1117" stroke="#30363D"/><g class="l" style="animation-delay:0s"><text x="40" y="58" fill="#8A63FF" font-size="14" font-weight="700" letter-spacing="3">04 — CONTACTO</text><text x="40" y="92" fill="#FFFFFF" font-size="30" font-weight="800">Trabajemos juntos</text></g><line class="d" x1="40" y1="110" x2="1160" y2="110" stroke="#512BD4" stroke-width="2" style="animation-delay:0.3s"/><text class="r" style="animation-delay:.8s" x="40" y="160" fill="#C9D1D9" font-size="20">Disponible para proyectos freelance, colaboraciones y posiciones Full Stack / .NET.</text><g class="r" style="animation-delay:1.1s"><rect x="40" y="190" width="420" height="56" rx="28" fill="#512BD4"/><text x="250" y="225" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="700">jesus1407tj@gmail.com</text></g><text class="f" style="animation-delay:1.4s" x="490" y="225" fill="#8B949E" font-size="17">Colombia</text></svg>
